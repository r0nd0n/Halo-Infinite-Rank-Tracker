<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Halo Infinite Rank Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2300b2ff'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>Halo Infinite</h1>
          <p>Ranked CSR Tracker</p>
        </div>
      </div>
      <div class="toolbar">
        <span id="meta" class="meta">Loading…</span>
        <button id="add-account" type="button" class="primary" title="Track another gamertag">
          + Add Account
        </button>
        <button id="refresh" type="button" title="Force a fresh fetch from the data source">
          Refresh
        </button>
      </div>
    </header>

    <main>
      <section id="accounts" class="accounts" aria-label="Tracked accounts">
        <p class="empty">Loading accounts…</p>
      </section>
    </main>

    <footer class="footer">
      <span id="legend" class="legend"></span>
    </footer>

    <dialog id="account-dialog" class="dialog">
      <form id="account-form" method="dialog">
        <h2>Add account</h2>
        <label class="field">
          <span class="field-label">Username</span>
          <input
            id="account-gamertag"
            name="gamertag"
            type="text"
            autocomplete="off"
            spellcheck="false"
            maxlength="64"
            placeholder="e.g. MasterChief"
            required
          />
        </label>
        <label class="field">
          <span class="field-label">Email address <em>(optional)</em></span>
          <input
            id="account-email"
            name="email"
            type="text"
            inputmode="email"
            autocomplete="off"
            spellcheck="false"
            maxlength="254"
            placeholder="e.g. chief@example.com"
          />
        </label>
        <p id="account-error" class="form-error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button type="button" id="account-cancel">Cancel</button>
          <button type="submit" id="account-submit" class="primary">Add account</button>
        </div>
      </form>
    </dialog>

    <script src="./app.js" type="module"></script>
  </body>
</html>
